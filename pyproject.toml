[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "search-names"
version = "0.6.0"
description = "Prepare personal names and search CSV text corpora"
authors = [
    {name = "Suriyan Laohaprapanon", email = "suriyant@gmail.com"},
    {name = "Gaurav Sood", email = "gsood07@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]
keywords = ["search", "names", "text", "corpus", "pattern", "ner", "nlp", "entity-recognition", "entity-linking", "fuzzy-matching"]
dependencies = [
    "nameparser>=1.1.0",
    "python-Levenshtein>=0.27.0",
    "regex>=2024.0.0",
    "typer>=0.20.0",
    "pydantic>=2.12.0",
    "rich>=14.0.0",
    "parsernaam>=0.3.0",
    "numpy>=2.0.0",
    "pandas>=2.3.0",
    "spacy>=3.8.0",
    "sentence-transformers>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/appeler/search-names"
Documentation = "https://appeler.github.io/search-names/"
Repository = "https://github.com/appeler/search-names"
Issues = "https://github.com/appeler/search-names/issues"

[project.scripts]
search-names = "search_names.cli:main_cli"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
timeout = 300
addopts = "--timeout=300 --tb=short --cov=search_names --cov-report=term-missing"
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::pytest.PytestConfigWarning",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300", "B008", "C901", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF", "PT009", "PT027"]
"docs/**" = ["D"]

[tool.deptry.per_rule_ignores]
# python-Levenshtein package provides the Levenshtein module (imported as "from Levenshtein import distance")
DEP002 = ["python-Levenshtein"]
# Allow importing Levenshtein module from python-Levenshtein package
DEP003 = ["Levenshtein"]

[tool.deptry]
extend_exclude = ["docs"]

[dependency-groups]
dev = [
    "deptry>=0.24.0",
    "pre-commit>=4.5.0",
    "ruff>=0.14",
    "pyright>=1.1.390",
    "pydoclint>=0.5",
    { include-group = "test" },
]
test = [
    "coverage>=7.12.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.3.1",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
docs = [
    "sphinx>=8",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.coverage.run]
branch = true
source = ["search_names"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.codespell]
# The corpora are names: a "misspelling" in a list of surnames is usually a
# real surname, and correcting one would corrupt the data. codespell reported
# 25,026 findings across this repo; seven were real, all in
# pipeline/step4_search.py, and all are fixed rather than skipped.
skip = "*.csv,*.parquet,*.joblib,./examples,./nltk_data,./docs,uv.lock"
